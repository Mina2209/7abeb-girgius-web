<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Targeted substitution for the PowerPoint preview converter.

    The hymn decks declare cs="Times New Roman" for their Arabic lyric text.
    Times New Roman is not present in this image, and fontconfig's default
    fallback resolves that request to Noto Naskh Arabic / Noto Sans, in which
    LibreOffice emits unshaped (disconnected) Arabic glyphs.

    Reassign exactly this one family to Tajawal (OFL, also embedded inside the
    decks themselves), which LibreOffice shapes correctly. No other family is
    touched; Latin text requests (Calibri -> Carlito, DejaVu, etc.) are unaffected.
  -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>Times New Roman</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Tajawal</string>
    </edit>
  </match>
</fontconfig>
